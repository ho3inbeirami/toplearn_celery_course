services:
  redis:
    image: redis:7.0.11-alpine
    container_name: redis

  celery:
    build:
      context: ./eshop
      dockerfile: dockerfile
    container_name: celery_container
    # command: celery -A config.celery_base  worker -l INFO -Q queue1  
    command: celery -A config.celery_base  worker -l INFO -Q tasks #,celery:1,celery:2,celery:3
    depends_on:
      - redis
      - rabbitmq
    volumes:
      - ./eshop/:/app

  eshop:
    build:
      context: ./eshop
      dockerfile: dockerfile
    container_name: eshop_container

    command: python3 manage.py  runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

    volumes:
      - ./eshop/:/app
    depends_on:
      - redis
      - celery
      - rabbitmq
      - flower
  # stand_alone_celery:
  #   build:
  #     context: ./stand_alone_celery
  #     dockerfile: dockerfile
  #   container_name: stand_alone_celery_container
  #   volumes:
  #     - ./stand_alone_celery/:/app
  #   command: celery -A celery_base worker -l INFO -Q queue2
  #   depends_on:
  #     - redis

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq_container

    ports:
      - "5672:5672"
      - "15672:15672"

  flower:
    image: mher/flower:latest
    container_name: flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL= amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
